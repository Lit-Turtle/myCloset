<!DOCTYPE html>
<html lang ="en">
    <head>
        <title>My Closet Maker</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale = 1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <h1>My Closet Maker</h1>
            <!--hat-->
            <div id="hat-box" class="cate-box">
                <button id="hl-btn"><</button>
                <div id="h-img"></div>
                <button id="hr-btn">></button>
            </div>
            <!--tops-->
            <div id="top-box" class="cate-box">
                <button id="tl-btn"><</button>
                <div id="t-img"></div>
                <button id="tr-btn">></button>
            </div>
            <!--bottoms-->
            <div id="bottom-box" class="cate-box">
                <button id="bl-btn"><</button>
                <div id="b-img"></div>
                <button id="br-btn">></button>
            </div>
            <!--shoes-->
            <div id="shoe-box" class="cate-box">
                <button id="sl-btn"><</button>
                <div id="s-img"></div>
                <button id="sr-btn">></button>
            </div>
            <button id="save-btn">Save Fit</button><!--Save Fit Button-->
            <!--Add Item-->
            <div id="addCloth">
                <h4>Add Cloth</h4>
                <select id="addSelect">
                    <option value="invalid">Select One</option>
                    <option value="hat">Hat</option>
                    <option value="top">Top</option>
                    <option value="bottom">Bottom</option>
                    <option value="shoe">Shoe</option>
                </select>
                <input placeholder="Enter image address" id="addInput" required/>
                <button id="addSubmit">Submit</button>
            </div>

            <!--Results/Saved-->
            <div id="save-box"></div>
        </div>
    </body>
    <script src="script.js"></script>
</html>
